name: MacDroid
options:
  bundleIdPrefix: kr.macdroid
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 로컬 개발/자체 배포용: 서명 없이 실행. 배포 시 Developer ID 서명 단계 추가 필요.
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: "NO"
    DEAD_CODE_STRIPPING: "YES"
targets:
  MacDroid:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MacDroid
        CFBundleName: MacDroid
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        CFBundleIconFile: AppIcon
        ITSAppUsesNonExemptEncryption: false
    postBuildScripts:
      - name: Install Vendor Binaries
        script: |
          "$PROJECT_DIR/scripts/install-vendor.sh" "$BUILT_PRODUCTS_DIR/$WRAPPER_NAME" "$PROJECT_DIR"

  # 에이전트/스크립트용 CLI — GUI Core(ADB/Scrcpy/AppCatalog)를 그대로 공유한다.
  macdroid:
    type: tool
    platform: macOS
    sources:
      - path: App/Sources/Core
      - path: App/Sources/Models
      - path: App/Sources/Support/Binaries.swift
      - path: App/Sources/Support/ProcessRunner.swift
      - path: CLI/Sources
    settings:
      base:
        PRODUCT_NAME: macdroid
        PRODUCT_BUNDLE_IDENTIFIER: kr.macdroid.cli
    postBuildScripts:
      # 실행 파일 옆에 bin/lib/share를 깔아 Binaries가 그대로 해석하게 한다.
      - name: Install Vendor Binaries (CLI)
        script: |
          "$PROJECT_DIR/scripts/install-vendor.sh" "$TARGET_BUILD_DIR" "$PROJECT_DIR"
    scheme:
      testTargets: []
