name: MacDroid
options:
  bundleIdPrefix: kr.macdroid
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 로컬 개발/자체 배포용: 서명 없이 실행. 배포 시 Developer ID 서명 단계 추가 필요.
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: "NO"
    DEAD_CODE_STRIPPING: "YES"
targets:
  MacDroid:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MacDroid
        CFBundleName: MacDroid
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        CFBundleIconFile: AppIcon
        ITSAppUsesNonExemptEncryption: false
    postBuildScripts:
      - name: Install Vendor Binaries
        script: |
          "$PROJECT_DIR/scripts/install-vendor.sh" "$BUILT_PRODUCTS_DIR/$WRAPPER_NAME" "$PROJECT_DIR"
